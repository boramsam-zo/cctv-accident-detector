services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctv_local
      POSTGRES_DB: cctv
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cctv -d cctv"]
      interval: 3s
      retries: 20

volumes:
  postgres_data:
